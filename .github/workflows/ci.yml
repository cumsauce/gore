name: CI

# Modelled on Stalker's: Gore is pure Java, so one job builds the jar and
# checks its contents, and a version tag publishes the release. The mod's work
# is particles and decals, which need a GPU, so the only way to see it is Loom's
# client game test: it drives the real client and screenshots it. That job runs
# under Xvfb with Mesa's software Vulkan, and a manual run is enough for it.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      gametest:
        description: Run the client game test (slow, software renderer)
        type: boolean
        default: false

# Actions from outside GitHub's own `actions/` are pinned to a commit, since
# a tag can be moved to other code; the comment names the release it was.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew build
      # The jar must carry the mod metadata, both environment source sets and
      # every asset the decals and particles load by name at runtime. A missing
      # texture is a silent purple-and-black square in game, not a build error,
      # so it is checked here instead.
      - name: Check the jar
        run: |
          jar=$(ls build/libs/gore-*.jar | grep -v sources)
          unzip -l "$jar" | tee contents
          entries="fabric.mod.json
            assets/gore/particles/blood_mist.json assets/gore/particles/blood_drop.json
            assets/gore/particles/blood_jet.json
            assets/gore/textures/particle/blood_mist_0.png assets/gore/textures/particle/blood_mist_1.png
            assets/gore/textures/particle/blood_mist_2.png assets/gore/textures/particle/blood_drop_0.png
            assets/gore/textures/particle/blood_drop_1.png assets/gore/textures/particle/blood_drop_2.png
            assets/gore/textures/decal/blood_atlas.png
            assets/gore/icon.png
            dev/lume/gore/Gore.class dev/lume/gore/Bleeding.class dev/lume/gore/Decal.class
            dev/lume/gore/DecalStore.class dev/lume/gore/GorePayloads.class
            dev/lume/gore/Sync.class dev/lume/gore/Wash.class dev/lume/gore/BloodTrail.class
            dev/lume/gore/StainBinding.class dev/lume/gore/DecalAging.class dev/lume/gore/StainStore.class
            dev/lume/gore/client/GoreClient.class dev/lume/gore/client/DecalManager.class
            dev/lume/gore/client/DecalRenderer.class dev/lume/gore/client/BloodMistParticle.class
            dev/lume/gore/client/BloodDropParticle.class dev/lume/gore/client/BloodJetParticle.class
            dev/lume/gore/client/BodyDamageLayer.class dev/lume/gore/client/BodyStainLayer.class
            dev/lume/gore/client/BloodItemDecorations.class"
          for entry in $entries; do
            grep -q " $entry\$" contents || { echo "$jar has no $entry" >&2; exit 1; }
          done
      - uses: actions/upload-artifact@v7
        with:
          name: gore-mod
          path: build/libs/gore-*.jar

  # The client game test renders the mod for real: a stone room, a wounded cow,
  # arrows for a directed spray, then screenshots. It needs a GPU context, which
  # on a runner means Xvfb and Mesa's software Vulkan (lavapipe), as in yakvc
  # and earshot. Only a manual run with "Run the client game test" ticked does
  # it, because it is slow and the software renderer is not the real thing.
  gametest:
    if: inputs.gametest
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y xvfb mesa-vulkan-drivers libvulkan1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Client gametest
        run: ./gradlew runClientGameTest -Pgore.runDir="$RUNNER_TEMP/gore-run"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gametest-screenshots
          path: |
            ${{ runner.temp }}/gore-run/clientGameTest/screenshots/
            ${{ runner.temp }}/gore-run/clientGameTest/logs/

  # On a version tag: a GitHub prerelease with the jar.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: gore-mod
          path: dist
      - name: GitHub release
        run: |
          version=${GITHUB_REF_NAME#v}
          test -f "dist/gore-$version.jar" || { echo "tag $GITHUB_REF_NAME, but built $(ls dist)" >&2; exit 1; }
          flags=(--generate-notes)
          if [[ $version == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" "dist/gore-$version.jar"
