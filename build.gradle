plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"gore" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	// Run dirs must live on a filesystem that supports F_FULLFSYNC (Minecraft's
	// world session lock needs FileChannel.force); a VirtioFS share behind the
	// project directory does not, which is what a VM building in a folder shared
	// from its host has. Keep the game data on the local disk, and let
	// `-Pgore.runDir=<dir>` move it somewhere else (CI uses that).
	def runDirOverride = providers.gradleProperty('gore.runDir')

	def localRunDir = { String runName ->
		if (runDirOverride.isPresent()) {
			return "${runDirOverride.get()}/${runName}"
		}
		return "${System.getProperty('user.home')}/gore-run/${runName}"
	}

	runs {
		configureEach {
			runDir = localRunDir(name)
		}
	}

	// Loom's client game-test configuration hardcodes its run dir to
	// `build/run/clientGameTest`, *after* the `runs` block above, so it has to be
	// moved here or the game test creates its world on the shared volume and dies
	// on the save lock. `clientGameTest` inherits from `client`; both are run
	// configurations, so this catches whichever one is registered.
	afterEvaluate {
		runs.configureEach {
			runDir = localRunDir(name)

			// Seed the spray RNG for the client game test so decal placement is
			// replayable across runs; gore.dryScale is read by the drying system
			// and is inert until then.
			if (name == "clientGameTest") {
				vmArg "-Dgore.seed=20261016"
				vmArg "-Dgore.dryScale=0.02"
				// Per-tick particle trace for tools/trace.py (see ParticleTrace).
				vmArg "-Dgore.trace=${localRunDir(name)}/gore-trace.jsonl"
			}
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Plain JUnit 5 for the unit tests (StainStoreTest); Loom does not put it on
	// the test classpath by itself.
	testImplementation "org.junit.jupiter:junit-jupiter:5.13.4"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.13.4"
}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

// The only way to see the mod render on a machine whose `runClient` cannot get a
// GL context (a VM, where GLFW's NSGL backend finds no pixel format) is Loom's
// client game-test run configuration: it drives the real client on its own render
// thread. `runClientGameTest` also needs `-Pgore.runDir=<dir on a local disk>`,
// because the game test creates a world and Minecraft's save lock needs
// F_FULLFSYNC, which a VirtioFS share lacks.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "gore-gametest"
		// Nothing in this mod is server-testable: bleeding, decals and particles
		// are all rendering, so there are no server game tests to run.
		enableGameTests = false
		enableClientGameTests = true
	}
}

// Fast inspection tools: plain Java mains in the test source set that need no
// game, no window and no GL (see README, Development). Properties pass through
// as -P<name>=<value>, e.g. ./gradlew previewBlood -Pscene=drips -Poverlay.
def inspectTask = { String taskName, String mainName, List<String> props, String text ->
	tasks.register(taskName, JavaExec) {
		group = "inspection"
		description = text
		dependsOn tasks.named("testClasses")
		classpath = sourceSets.test.runtimeClasspath
		mainClass = mainName
		workingDir = projectDir
		props.each { p ->
			if (project.hasProperty(p)) {
				def value = project.property(p).toString()
				systemProperty p, value.isEmpty() ? "true" : value
			}
		}
	}
}

inspectTask("previewBlood", "dev.lume.gore.BloodPreview",
		["scene", "from", "to", "step", "scale", "seed", "overlay", "out", "gore.dryScale"],
		"Bakes a blood scene with BloodField over a range of ticks into PNGs, an APNG and a contact sheet.")
inspectTask("flightCheck", "dev.lume.gore.FlightCheck",
		["seed", "severity", "out"],
		"Flies every stain droplet of a spray and checks it lands on its stain on its born tick.")

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Ask for a JDK 25 wherever this is built, rather than whichever JVM happens
	// to be running Gradle: CI installs one, and a developer's `JAVA_HOME` may
	// point at something else. The toolchain finds an installed JDK 25 and fails
	// with a clear message if there is none.
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}

	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
