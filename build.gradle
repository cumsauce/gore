plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"gore" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	// Run dirs must live on a filesystem that supports F_FULLFSYNC (Minecraft's
	// world session lock needs FileChannel.force); a VirtioFS share behind the
	// project directory does not, which is what a VM building in a folder shared
	// from its host has. Keep the game data on the local disk, and let
	// `-Pgore.runDir=<dir>` move it somewhere else (CI uses that).
	def runDirOverride = providers.gradleProperty('gore.runDir')

	def localRunDir = { String runName ->
		if (runDirOverride.isPresent()) {
			return "${runDirOverride.get()}/${runName}"
		}
		return "${System.getProperty('user.home')}/gore-run/${runName}"
	}

	runs {
		configureEach {
			runDir = localRunDir(name)
		}
	}

	// Loom's client game-test configuration hardcodes its run dir to
	// `build/run/clientGameTest`, *after* the `runs` block above, so it has to be
	// moved here or the game test creates its world on the shared volume and dies
	// on the save lock. `clientGameTest` inherits from `client`; both are run
	// configurations, so this catches whichever one is registered.
	afterEvaluate {
		runs.configureEach {
			runDir = localRunDir(name)
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

// The only way to see the mod render on a machine whose `runClient` cannot get a
// GL context (a VM, where GLFW's NSGL backend finds no pixel format) is Loom's
// client game-test run configuration: it drives the real client on its own render
// thread. `runClientGameTest` also needs `-Pgore.runDir=<dir on a local disk>`,
// because the game test creates a world and Minecraft's save lock needs
// F_FULLFSYNC, which a VirtioFS share lacks.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "gore-gametest"
		// Nothing in this mod is server-testable: bleeding, decals and particles
		// are all rendering, so there are no server game tests to run.
		enableGameTests = false
		enableClientGameTests = true
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Ask for a JDK 25 wherever this is built, rather than whichever JVM happens
	// to be running Gradle: CI installs one, and a developer's `JAVA_HOME` may
	// point at something else. The toolchain finds an installed JDK 25 and fails
	// with a clear message if there is none.
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}

	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
